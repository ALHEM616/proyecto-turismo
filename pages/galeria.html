<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tihuanacu | Galería</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../js/tailwind-config.js"></script>

  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="font-sans text-piedra-900 antialiased">

  <header class="sticky top-0 z-50 bg-piedra-900 text-white shadow-lg">
    <nav
      class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8"
    >
      <a href="../index.html" class="font-display text-xl font-bold">
        Tihuanacu
      </a>

      <div class="hidden items-center gap-7 lg:flex">
        <a href="../index.html">Inicio</a>
        <a href="historia.html">Historia</a>
        <a href="atractivos.html">Atractivos</a>
        <a href="visita.html">Visita</a>

        <a
          href="galeria.html"
          class="border-b-2 border-tierra-300 pb-1 text-tierra-300"
        >
          Galería
        </a>

        <a
          href="contacto.html"
          class="rounded-full bg-tierra-600 px-5 py-2.5"
        >
          Contacto
        </a>
      </div>

      <button
        id="menu-button"
        class="flex h-11 w-11 items-center justify-center border border-white/20 lg:hidden"
        aria-expanded="false"
      >
        <span id="menu-open-icon">☰</span>
        <span id="menu-close-icon" class="hidden">×</span>
      </button>
    </nav>

    <div id="mobile-menu" class="hidden px-4 py-5 lg:hidden">
      <div class="flex flex-col gap-3">
        <a class="mobile-link" href="../index.html">Inicio</a>
        <a class="mobile-link" href="historia.html">Historia</a>
        <a class="mobile-link" href="atractivos.html">Atractivos</a>
        <a class="mobile-link" href="visita.html">Visita</a>
        <a class="mobile-link text-tierra-300" href="galeria.html">Galería</a>
        <a class="mobile-link" href="contacto.html">Contacto</a>
      </div>
    </div>
  </header>

  <main>
    <section class="bg-piedra-100 py-24 text-center">
      <div class="mx-auto max-w-4xl px-4">
        <p class="font-bold uppercase tracking-[0.25em] text-tierra-700">
          Imágenes del destino
        </p>

        <h1 class="mt-4 font-display text-5xl font-bold sm:text-6xl">
          Galería de Tihuanacu
        </h1>

        <p class="mt-6 text-lg leading-8 text-piedra-600">
          Una selección visual de sus monumentos, paisajes y detalles
          arqueológicos.
        </p>
      </div>
    </section>

    <section class="py-24">
      <div
        class="mx-auto grid max-w-7xl auto-rows-[280px] gap-5 px-4 sm:px-6 md:grid-cols-2 lg:grid-cols-4 lg:px-8"
      >
        <figure
          class="gallery-card relative overflow-hidden rounded-3xl md:row-span-2"
        >
          <img
            src="../assets/images/puerta-sol.jpg"
            alt="Puerta del Sol"
            class="gallery-image h-full w-full bg-piedra-300 object-cover"
          >
        </figure>

        <figure
          class="gallery-card relative overflow-hidden rounded-3xl lg:col-span-2"
        >
          <img
            src="../assets/images/kalasasaya.jpg"
            alt="Kalasasaya"
            class="gallery-image h-full w-full bg-piedra-300 object-cover"
          >
        </figure>

        <figure class="gallery-card overflow-hidden rounded-3xl">
          <img
            src="../assets/images/paisaje.jpg"
            alt="Paisaje andino"
            class="gallery-image h-full w-full bg-piedra-300 object-cover"
          >
        </figure>

        <figure
          class="gallery-card overflow-hidden rounded-3xl lg:col-span-2"
        >
          <img
            src="../assets/images/akapana.jpg"
            alt="Pirámide de Akapana"
            class="gallery-image h-full w-full bg-piedra-300 object-cover"
          >
        </figure>

        <figure class="gallery-card overflow-hidden rounded-3xl">
          <img
            src="../assets/images/monolito.jpg"
            alt="Monolito de Tihuanacu"
            class="gallery-image h-full w-full bg-piedra-300 object-cover"
          >
        </figure>

        <figure class="gallery-card overflow-hidden rounded-3xl">
          <img
            src="../assets/images/templete.jpg"
            alt="Templete semisubterráneo"
            class="gallery-image h-full w-full bg-piedra-300 object-cover"
          >
        </figure>
      </div>
    </section>
  </main>

  <footer class="bg-piedra-900 py-10 text-center text-white">
    © <span class="current-year"></span> Turismo Tihuanacu.
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
