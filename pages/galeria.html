<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tihuanacu | Galería</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="../js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="font-sans text-piedra-900">

  <header class="bg-piedra-900 py-5 text-white">
    <nav
      class="mx-auto flex max-w-7xl justify-between px-4 sm:px-6 lg:px-8"
    >
      <a href="../index.html" class="font-display text-xl font-bold">
        Tihuanacu
      </a>

      <div class="hidden gap-7 lg:flex">
        <a href="../index.html">Inicio</a>
        <a href="historia.html">Historia</a>
        <a href="atractivos.html">Atractivos</a>
        <a href="visita.html">Visita</a>
        <a href="galeria.html" class="text-tierra-300">Galería</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="bg-piedra-100 py-24 text-center">
      <div class="mx-auto max-w-4xl px-4">
        <p
          class="font-bold uppercase tracking-[0.25em] text-tierra-700"
        >
          Imágenes
        </p>

        <h1 class="mt-4 font-display text-5xl font-bold">
          Galería de Tihuanacu
        </h1>
      </div>
    </section>

    <section class="py-24">
      <div
        class="mx-auto grid max-w-7xl auto-rows-[280px] gap-5 px-4 sm:px-6 md:grid-cols-2 lg:grid-cols-4 lg:px-8"
      >
        <figure
          class="gallery-item relative overflow-hidden rounded-3xl md:row-span-2"
        >
          <img
            src="https://images.unsplash.com/photo-1531968455001-5c5272a41129?auto=format&fit=crop&w=900&q=85"
            alt="Arquitectura ancestral"
            class="gallery-image h-full w-full object-cover"
          >
        </figure>

        <figure
          class="gallery-item relative overflow-hidden rounded-3xl lg:col-span-2"
        >
          <img
            src="https://images.unsplash.com/photo-1526392060635-9d6019884377?auto=format&fit=crop&w=1200&q=85"
            alt="Paisaje arqueológico"
            class="gallery-image h-full w-full object-cover"
          >
        </figure>

        <figure class="gallery-item overflow-hidden rounded-3xl">
          <img
            src="https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86?auto=format&fit=crop&w=700&q=85"
            alt="Montañas andinas"
            class="gallery-image h-full w-full object-cover"
          >
        </figure>

        <figure
          class="gallery-item overflow-hidden rounded-3xl lg:col-span-2"
        >
          <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=85"
            alt="Patrimonio e historia"
            class="gallery-image h-full w-full object-cover"
          >
        </figure>

        <figure class="gallery-item overflow-hidden rounded-3xl">
          <img
            src="https://images.unsplash.com/photo-1531065208531-4036c0dba3ca?auto=format&fit=crop&w=700&q=85"
            alt="Detalles en piedra"
            class="gallery-image h-full w-full object-cover"
          >
        </figure>
      </div>
    </section>
  </main>

  <footer class="bg-piedra-900 py-8 text-center text-white">
    © <span class="current-year"></span> Turismo Tihuanacu.
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
