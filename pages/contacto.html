<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tihuanacu | Contacto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="../js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="font-sans text-piedra-900">

  <header class="bg-piedra-900 py-5 text-white">
    <nav
      class="mx-auto flex max-w-7xl justify-between px-4 sm:px-6 lg:px-8"
    >
      <a href="../index.html" class="font-display text-xl font-bold">
        Tihuanacu
      </a>

      <div class="hidden gap-7 lg:flex">
        <a href="../index.html">Inicio</a>
        <a href="historia.html">Historia</a>
        <a href="atractivos.html">Atractivos</a>
        <a href="visita.html">Visita</a>
        <a href="galeria.html">Galería</a>
        <a href="contacto.html" class="text-tierra-300">Contacto</a>
      </div>
    </nav>
  </header>

  <main class="bg-tierra-700 py-24 text-white">
    <section
      class="mx-auto grid max-w-7xl gap-14 px-4 sm:px-6 lg:grid-cols-2 lg:px-8"
    >
      <div>
        <p
          class="font-bold uppercase tracking-[0.25em] text-tierra-200"
        >
          Escríbenos
        </p>

        <h1 class="mt-4 font-display text-5xl font-bold">
          Planifica tu experiencia
        </h1>

        <p class="mt-6 text-lg leading-8 text-tierra-100">
          Envíanos tus consultas sobre transporte, visitas grupales y
          recorridos turísticos.
        </p>

        <div class="mt-10 space-y-4">
          <p>
            <strong>Correo:</strong>
            turismo@tihuanacu.bo
          </p>

          <p>
            <strong>Teléfono:</strong>
            +591 700 000 00
          </p>
        </div>
      </div>

      <form
        id="contact-form"
        class="rounded-3xl bg-white p-8 text-piedra-900 shadow-2xl"
      >
        <div>
          <label for="name" class="mb-2 block font-semibold">
            Nombre
          </label>

          <input
            id="name"
            name="name"
            type="text"
            required
            class="w-full rounded-xl border border-piedra-300 px-4 py-3 focus:border-tierra-600 focus:outline-none"
          >
        </div>

        <div class="mt-6">
          <label for="email" class="mb-2 block font-semibold">
            Correo electrónico
          </label>

          <input
            id="email"
            name="email"
            type="email"
            required
            class="w-full rounded-xl border border-piedra-300 px-4 py-3 focus:border-tierra-600 focus:outline-none"
          >
        </div>

        <div class="mt-6">
          <label for="subject" class="mb-2 block font-semibold">
            Motivo
          </label>

          <select
            id="subject"
            name="subject"
            required
            class="w-full rounded-xl border border-piedra-300 px-4 py-3"
          >
            <option value="">Selecciona una opción</option>
            <option value="informacion">Información general</option>
            <option value="transporte">Transporte</option>
            <option value="recorrido">Recorridos</option>
            <option value="grupo">Visita grupal</option>
          </select>
        </div>

        <div class="mt-6">
          <label for="message" class="mb-2 block font-semibold">
            Mensaje
          </label>

          <textarea
            id="message"
            name="message"
            rows="5"
            required
            class="w-full rounded-xl border border-piedra-300 px-4 py-3 focus:border-tierra-600 focus:outline-none"
          ></textarea>
        </div>

        <button
          type="submit"
          class="mt-7 w-full rounded-xl bg-piedra-900 px-6 py-3.5 font-bold text-white hover:bg-tierra-700"
        >
          Enviar consulta
        </button>

        <p
          id="form-message"
          class="mt-4 hidden rounded-xl bg-green-50 px-4 py-3 font-semibold text-green-800"
        ></p>
      </form>
    </section>
  </main>
